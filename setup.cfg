# flake8 does not read ``pyproject.toml``, so its config lives here.
# We only run wemake-python-styleguide (ruff handles everything else).
# Docs: https://wemake-python-styleguide.readthedocs.io

[flake8]
format = wemake
show-source = true
statistics = false
doctests = true

max-complexity = 6
max-line-length = 88
max-imports = 25
max-arguments = 6

allowed-domain-names = data

select = WPS, E99

ignore =
  # Allow logic in `__init__`:
  WPS412

per-file-ignores =
  # BASELINE: every entry below is debt. Remove a code from a file
  # when you clean that file; new code must pass without new entries.
  # Autogenerated migrations:
  */migrations/*.py: WPS102, WPS114, WPS226, WPS301, WPS432, WPS458
  # Tests:
  tests/*.py: WPS110, WPS111, WPS118, WPS202, WPS204, WPS210, WPS213, WPS214, WPS218, WPS221, WPS226, WPS338, WPS347, WPS420, WPS431, WPS432, WPS604
  # Source:
  eav/admin.py: WPS110, WPS234
  eav/decorators.py: WPS430
  eav/fields.py: WPS110, WPS475
  eav/forms.py: WPS110, WPS111, WPS115, WPS210, WPS231, WPS235, WPS338, WPS475
  eav/logic/managers.py: WPS110
  eav/logic/object_pk.py: WPS407
  eav/logic/slug.py: WPS110, WPS210, WPS237
  eav/managers.py: WPS110, WPS210
  eav/models/__init__.py: WPS410
  eav/models/attribute.py: WPS110, WPS115, WPS214, WPS235, WPS432, WPS458, WPS601
  eav/models/entity.py: WPS110, WPS111, WPS214, WPS226, WPS231, WPS338, WPS602
  eav/models/enum_group.py: WPS110, WPS458
  eav/models/enum_value.py: WPS110
  eav/models/value.py: WPS110, WPS226, WPS237, WPS458
  eav/queryset.py: WPS110, WPS111, WPS210, WPS231, WPS232, WPS335, WPS347, WPS529
  eav/registry.py: WPS214, WPS338, WPS421, WPS602
  eav/validators.py: WPS110, WPS202, WPS229
  eav/widgets.py: WPS110
  test_project/models.py: WPS110, WPS202
  test_project/settings.py: WPS226, WPS407, WPS529

extend-exclude =
  .venv
  docs
  htmlcov
