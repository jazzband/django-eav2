# See https://pre-commit.com for more information
default_language_version:
  python: python3.13

repos:
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 4f85d46a92dc17713078e5de73f8a13190edf6fc  # frozen: 0.38.2
  hooks:
    - id: check-dependabot
    - id: check-github-workflows
    - id: check-readthedocs

- repo: https://github.com/rhysd/actionlint
  rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
  hooks:
    - id: actionlint

- repo: https://github.com/woodruffw/zizmor-pre-commit
  rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
  hooks:
    - id: zizmor
      args: ["--no-progress"]

- repo: https://github.com/tox-dev/pyproject-fmt
  rev: 50e0f3aee9dc5747a5f173f79a7417403c18dda6  # frozen: v2.30.3
  hooks:
    - id: pyproject-fmt

- repo: https://github.com/crate-ci/typos
  rev: 9023c1f779400877cafdd98052113fc777e2cfdc  # frozen: v1.51.1
  hooks:
    - id: typos

- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
    - id: codespell
      args: ["--write-changes"]

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
  - id: mixed-line-ending

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e  # frozen: v0.17.0
  hooks:
    # Run the linter.
    - id: ruff
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
