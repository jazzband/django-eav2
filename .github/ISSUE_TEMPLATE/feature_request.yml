name: Feature request
description: Suggest an improvement or a missing capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, and why the current behaviour does not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: How you imagine it working. An example of the code you would write is ideal.
