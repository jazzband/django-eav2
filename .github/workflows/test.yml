name: test

"on":
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - run: uv sync
      - run: uv run --no-sync poe lint
      - run: uv run --no-sync poe migrations
      - run: uv run --no-sync poe smoke

  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django-version: ['5.2', '6.0', '6.1']
        exclude:
          # Django 6.0 and 6.1 require Python 3.12+
          - python-version: '3.10'
            django-version: '6.0'
          - python-version: '3.11'
            django-version: '6.0'
          - python-version: '3.10'
            django-version: '6.1'
          - python-version: '3.11'
            django-version: '6.1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: |
          uv sync --python ${{ matrix.python-version }}
          uv pip install "django==${{ matrix.django-version }}.*"

      - name: Run tests
        run: uv run --no-sync poe unit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml

  test-databases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: ['postgres', 'mysql']
        key-field: ['BigAutoField', 'UUIDField']

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eav
          POSTGRES_USER: eav
          POSTGRES_PASSWORD: eav
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U eav"
          --health-interval 2s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: eav
          MYSQL_ROOT_PASSWORD: eav
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -peav"
          --health-interval 2s
          --health-retries 30

    env:
      EAV_TEST_DB: ${{ matrix.database }}
      EAV_TEST_PK_FIELD: django.db.models.${{ matrix.key-field }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install system dependencies
        if: matrix.database == 'mysql'
        run: sudo apt-get install -y default-libmysqlclient-dev gcc pkg-config

      - run: uv sync --group ${{ matrix.database }}
      - run: uv run --no-sync poe unit
      - run: uv run --no-sync poe migrations

  test-uuid-keys:
    runs-on: ubuntu-latest
    env:
      EAV_TEST_PK_FIELD: django.db.models.UUIDField
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - run: uv sync
      - run: uv run --no-sync poe unit
      - run: uv run --no-sync poe migrations

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - run: uv sync --group docs
      - run: uv run --no-sync poe docs

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - run: uv sync
      - run: uv run --no-sync poe package
      - run: uvx twine check dist/*
