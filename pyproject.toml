[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]


[project]
name = "django-eav2"
version = "1.8.2"
description = "Entity-Attribute-Value storage for Django"
readme = "README.md"
keywords = [
  "database",
  "django",
  "django-eav2",
  "eav",
  "sql",
]
license = "LGPL-3.0-or-later"
license-files = [ "LICENSE" ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "django>=5.2,<6.2",
]

[[project.authors]]
name = "Mauro Lizaur"
email = "mauro@sdf.org"

[project.urls]
Documentation = "https://django-eav2.readthedocs.io/en/latest/"
Changelog = "https://github.com/jazzband/django-eav2/blob/master/CHANGELOG.md"
Repository = "https://github.com/jazzband/django-eav2"
Issues = "https://github.com/jazzband/django-eav2/issues"


[dependency-groups]
dev = [
  "poethepoet>=0.34,<1",
  { include-group = "lint" },
  { include-group = "test" },
]
lint = [
  "mypy>=1.6,<3",
  "ruff>=0.6.3,<0.18",
]
test = [
  "hypothesis>=6.87.1,<7",
  "pytest>=7.4.3,<10",
  "pytest-cov>=4.1,<8",
  "pytest-django>=4.5.2,<5",
  "pytest-randomly>=3.15,<5",
]
docs = [
  "sphinx>=5,<9",
  "sphinx-rtd-theme>=1.3,<4",
]


[tool.hatch.build]
# Compiled translations are gitignored but must still ship:
artifacts = [ "*.mo" ]

[tool.hatch.build.targets.wheel]
packages = [ "eav" ]

[tool.hatch.build.targets.sdist]
include = [
  "eav/",
  "CHANGELOG.md",
  "LICENSE",
  "README.md",
]


[tool.uv]
# Docs: https://docs.astral.sh/uv/reference/settings
add-bounds = "major"
default-groups = [ "dev" ]


[tool.poe.tasks]
# Docs: https://poethepoet.natn.io
format = [
  { cmd = "ruff format" },
  { cmd = "ruff check --fix" },
]
lint = [
  { cmd = "ruff check" },
  { cmd = "ruff format --check --diff" },
]
unit = "pytest"
package = [
  { cmd = "uv lock --check" },
  { cmd = "uv build" },
  { cmd = "uv pip check" },
]
docs = "sphinx-build -W -b html docs/source docs/build"
test = [ "lint", "unit", "package" ]


[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN",      # Type hints related, let mypy handle these.
  "ARG",      # Unused arguments
  "CPY001",   # Copyright notices
  "D",        # Docstrings related
  "EM101",    # "Exception must not use a string literal, assign to variable first"
  "EM102",    # "Exception must not use an f-string literal, assign to variable first"
  "PD",       # Pandas related
  "Q000",     # For now
  "SIM105",   # "Use contextlib.suppress({exception}) instead of try-except-pass"
  "TRY003",   # "Avoid specifying long messages outside the exception class"
  ]

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false

[tool.ruff.lint.per-file-ignores]
# Allow private member access for Registry
"eav/registry.py" = ["SLF001"]

# Migrations are special
"**/migrations/*" = ["RUF012"]

# Sphinx specific
"docs/source/conf.py" = ["INP001"]

# pytest is even more special
"tests/*" = [
  "INP001",   # "Add an __init__.py"
  "PLR2004",  # "Magic value used in comparison"
  "PLW0108",  # "Lambda may be unnecessary" - used with assertRaises
  "PT009",    # "Use a regular assert instead of unittest-style"
  "PT027",    # "Use pytest.raises instead of unittest-style"
  "PT030",    # "pytest.warns match parameter" - broad warnings intentional in tests
  "S101",     # "Use of assert detected"
  "SLF001"    # "Private member accessed"
  ]

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"
