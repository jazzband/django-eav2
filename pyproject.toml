[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "django-eav2"
version = "1.8.2"
description = "Entity-Attribute-Value storage for Django"
readme = "README.md"
keywords = [
  "database",
  "django",
  "django-eav2",
  "eav",
  "sql",
]
license = "LGPL-3.0-or-later"
license-files = [ "LICENSE" ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "django>=5.2,<6.2",
]
[[project.authors]]
name = "Mauro Lizaur"
email = "mauro@sdf.org"
[project.urls]
Changelog = "https://github.com/jazzband/django-eav2/blob/master/CHANGELOG.md"
Documentation = "https://django-eav2.readthedocs.io/en/latest/"
Issues = "https://github.com/jazzband/django-eav2/issues"
Repository = "https://github.com/jazzband/django-eav2"

[dependency-groups]
dev = [
  "poethepoet>=0.34,<1",
  { include-group = "lint" },
  { include-group = "test" },
]
test = [
  "hypothesis>=6.87.1,<7",
  "pytest>=7.4.3,<10",
  "pytest-cov>=4.1,<8",
  "pytest-django>=4.5.2,<5",
  "pytest-randomly>=3.15,<6",
  "pytest-timeout>=2.4,<3",
]
docs = [
  "sphinx>=5,<9",
  "sphinx-rtd-theme>=1.3,<4",
]
lint = [
  "dennis>=1.1,<2",
  "django-stubs[compatible-mypy]>=6,<7",
  "import-linter>=2.5,<3",
  "mypy>=1.6,<3",
  "pyright>=1.1,<2",
  "ruff>=0.6.3,<0.18",
  "wemake-python-styleguide>=1.8,<2",
]
mysql = [ "mysqlclient>=2.2,<3" ]
postgres = [ "psycopg[binary]>=3.2,<4" ]

[tool.hatch]
[tool.hatch.build]
# Compiled translations are gitignored but must still ship:
artifacts = [ "*.mo" ]
targets.wheel.packages = [ "eav" ]
targets.sdist.include = [
  "eav/",
  "CHANGELOG.md",
  "LICENSE",
  "README.md",
]

[tool.uv]
default-groups = [ "dev" ]
# Docs: https://docs.astral.sh/uv/reference/settings
add-bounds = "major"

[tool.ruff]
target-version = "py310"
line-length = 88
[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "ANN",    # Type hints related, let mypy handle these.
  "ARG",    # Unused arguments
  "CPY001", # Copyright notices
  "D100",   # Module docstrings
  "D104",   # Package docstrings
  "D105",   # Magic method docstrings
  "D106",   # Nested class docstrings, such as Meta
  "D107",   # __init__ docstrings
  "D212",   # Multi-line summaries may start on the second line
  "D404",   # First word of the docstring
  "D405",   # Section name capitalization
  "EM101",  # "Exception must not use a string literal, assign to variable first"
  "EM102",  # "Exception must not use an f-string literal, assign to variable first"
  "PD",     # Pandas related
  "Q000",   # For now
  "SIM105", # "Use contextlib.suppress({exception}) instead of try-except-pass"
  "TRY003", # "Avoid specifying long messages outside the exception class"
]
# Migrations are special
per-file-ignores."**/migrations/*" = [ "D", "RUF012" ]
# Sphinx specific
per-file-ignores."docs/source/conf.py" = [ "D", "INP001" ]
# Allow private member access for Registry
per-file-ignores."eav/registry.py" = [ "SLF001" ]
per-file-ignores."test_project/**" = [ "D" ]
# pytest is even more special
per-file-ignores."tests/*" = [
  "D",       # Tests are named for what they check
  "INP001",  # "Add an __init__.py"
  "PLR2004", # "Magic value used in comparison"
  "PLW0108", # "Lambda may be unnecessary" - used with assertRaises
  "PT009",   # "Use a regular assert instead of unittest-style"
  "PT027",   # "Use pytest.raises instead of unittest-style"
  "PT030",   # "pytest.warns match parameter" - broad warnings intentional in tests
  "S101",    # "Use of assert detected"
  "SLF001"  # "Private member accessed"
]
flake8-implicit-str-concat.allow-multiline = false
# Use Google-style docstrings.
pydocstyle.convention = "google"

[tool.codespell]
# Docs: https://github.com/codespell-project/codespell
skip = "*.lock,*.po,CONTRIBUTORS.md,eav/migrations,htmlcov"

[tool.pyproject-fmt]
# Docs: https://pyproject-fmt.readthedocs.io/en/latest/configuration.html
column_width = 88
generate_python_version_classifiers = false
table_format = "long"

[tool.typos.files]
# Docs: https://github.com/crate-ci/typos
extend-exclude = [ "*.lock", "*.po", "CONTRIBUTORS.md", "eav/migrations" ]

[tool.mypy]
files = [ "eav" ]
exclude = [ "eav/migrations/" ]
warn_unreachable = true
local_partial_types = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
]
strict_equality_for_none = true
strict = true
# mypy config: https://mypy.readthedocs.io/en/stable/config_file.html
plugins = [ "mypy_django_plugin.main" ]












[tool.pyright]
venv = ".venv"
venvPath = "."
typeCheckingMode = "standard"
# pyright config: https://microsoft.github.io/pyright/#/configuration
include = [ "eav" ]
exclude = [ "**/migrations" ]

[tool.django-stubs]
django_settings_module = "test_project.settings"

[tool.pytest.ini_options]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--doctest-modules",
  "--ignore=docs",
  "--cov=eav",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
  "--cov-branch",
  "--cov-fail-under=95",
]
xfail_strict = true
filterwarnings = [ "error" ]
# pytest config: https://docs.pytest.org/en/stable/reference/customize.html
DJANGO_SETTINGS_MODULE = "test_project.settings"
timeout = 20

[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING:",
  "pragma: no cover",
]
skip_covered = true
show_missing = true
sort = "Cover"

[tool.poe]
[tool.poe.tasks]
# Docs: https://poethepoet.natn.io
format = [
  { cmd = "ruff format" },
  { cmd = "ruff check --fix" },
]
lint = [
  { cmd = "ruff check" },
  { cmd = "ruff format --check --diff" },
  { cmd = "flake8 ." },
  { cmd = "lint-imports" },
  { cmd = "dennis-cmd lint eav/locale" },
  { cmd = "mypy" },
  { cmd = "pyright" },
]
unit = "pytest"
migrations = "python manage.py makemigrations --check --dry-run"
# Modules that settings, models and migrations import must work before
# ``django.setup()``; each is imported in a fresh interpreter.
smoke = [
  { cmd = "python -c 'import eav'", env = { DJANGO_SETTINGS_MODULE = "test_project.settings" } },
  { cmd = "python -c 'import eav.decorators'", env = { DJANGO_SETTINGS_MODULE = "test_project.settings" } },
  { cmd = "python -c 'import eav.exceptions'", env = { DJANGO_SETTINGS_MODULE = "test_project.settings" } },
  { cmd = "python -c 'import eav.fields'", env = { DJANGO_SETTINGS_MODULE = "test_project.settings" } },
  { cmd = "python -c 'import eav.forms'", env = { DJANGO_SETTINGS_MODULE = "test_project.settings" } },
  { cmd = "python -c 'import eav.settings'", env = { DJANGO_SETTINGS_MODULE = "test_project.settings" } },
  { cmd = "python -c 'import eav.validators'", env = { DJANGO_SETTINGS_MODULE = "test_project.settings" } },
  { cmd = "python -c 'import eav.widgets'", env = { DJANGO_SETTINGS_MODULE = "test_project.settings" } },
  { cmd = "python -c 'import eav.logic.managers'", env = { DJANGO_SETTINGS_MODULE = "test_project.settings" } },
  { cmd = "python -c 'import eav.logic.slug'", env = { DJANGO_SETTINGS_MODULE = "test_project.settings" } },
  { cmd = "python -c 'import eav.logic.entity_pk'", env = { DJANGO_SETTINGS_MODULE = "test_project.settings" } },
  { cmd = "python -c 'import eav.logic.object_pk'", env = { DJANGO_SETTINGS_MODULE = "test_project.settings" } },
]
package = [
  { cmd = "uv lock --check" },
  { cmd = "uv build" },
  { cmd = "uv pip check" },
]
docs = "sphinx-build -W -b html docs/source docs/build"
test = [ "lint", "migrations", "smoke", "unit", "package" ]
